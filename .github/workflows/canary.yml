name: Canary

# Publishes a prerelease of @jk2908/solas under a dist-tag (`canary` or
# `experimental`), leaving `latest` untouched. Trigger it manually from the
# branch you want to try. Consumers install `@jk2908/solas@canary`.
#
# The version is generated in CI (next patch + tag + run number) and is not
# committed, so every run is unique and the working tree stays clean.
#
# Authentication uses npm Trusted Publishing (OIDC), so no token secret is
# stored. The package must have a trusted publisher configured on npmjs.com
# pointing at this repository and workflow file; npm then trusts the
# short-lived `id-token` minted for the run. Requires npm 11.5.1+.
#
# The trusted publisher is stage-only (direct `npm publish` is not allowed), so
# this workflow stages the version and a maintainer approves it with 2FA before
# it becomes installable.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish under
        required: true
        default: canary
        type: choice
        options:
          - canary
          - experimental

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm 11.5.1+; the bundled npm on Node 22 is older
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release check
        run: bun run release:check

      # Canaries track the next minor release: from a committed `0.7.0` this
      # produces `0.8.0-<tag>.<run>`, and after `0.8.0` is committed it becomes
      # `0.9.0-<tag>.<run>`. The build id keeps each run unique and monotonic.
      - name: Set canary version
        working-directory: packages/solas
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          NEXT=$(node -e "const [a,b]=process.argv[1].split('.').map(Number); process.stdout.write(a+'.'+(b+1)+'.0')" "$BASE")
          npm version "${NEXT}-${{ inputs.tag }}.${{ github.run_number }}.${{ github.run_attempt }}" --no-git-tag-version

      # No NODE_AUTH_TOKEN: npm detects the OIDC token automatically. Staging
      # (rather than publishing) matches the stage-only trusted publisher, so a
      # maintainer approves the version with 2FA before it goes live.
      - name: Stage package
        working-directory: packages/solas
        run: npm stage publish --access public --tag ${{ inputs.tag }}
