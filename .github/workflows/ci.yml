name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Tests
        run: |
          cd packages/solas
          bun run test

      - name: Browser tests
        run: |
          cd packages/solas
          bunx playwright install chromium
          bun run test:browser

      - name: Package prepublish check
        run: |
          cd packages/solas
          bun run prepublishOnly

      - name: Cloudflare example build
        run: |
          cd examples/cloudflare
          bun run build

      - name: Cloudflare example dev
        run: |
          cd examples/cloudflare
          bun run dev > /tmp/cloudflare-dev.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT

          for _ in $(seq 1 120); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/ || true)
            if [ "$CODE" = "200" ]; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/cloudflare-dev.log
          exit 1
